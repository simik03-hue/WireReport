name: Fetch headlines

# Runs the RSS fetch script on GitHub's own servers, on a timer.
# Nothing needs to run on your laptop at all — this workflow does it instead.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes. GitHub may delay this slightly under load.
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit the updated JSON back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the fetch script
        run: python3 scripts/fetch_feeds.py

      - name: Commit updated data files
        run: |
          git config user.name "wire-report-bot"
          git config user.email "actions@github.com"
          git add data/wire_data.json data/archive.json
          git diff --staged --quiet || git commit -m "Update headlines"
          git push

      - name: Deploy fresh data to Hostinger
        # Requires three repo secrets, set under
        # Settings -> Secrets and variables -> Actions in your GitHub repo:
        #   HOSTINGER_FTP_SERVER    e.g. ftp.yourdomain.com (find in hPanel -> FTP Accounts)
        #   HOSTINGER_FTP_USERNAME  from the same FTP Accounts page
        #   HOSTINGER_FTP_PASSWORD  from the same FTP Accounts page
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./data/
          server-dir: ./data/
          exclude: |
            **/.gitkeep
